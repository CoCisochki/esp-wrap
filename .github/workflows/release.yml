name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run unit tests
        run: go test -v ./...

      - name: Build multi-arch binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi

          echo "Building release for tag: $TAG_NAME"

          # Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-server ./cmd/esp-server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-client ./cmd/esp-client
          tar -czvf "dist/esp-wrap_${TAG_NAME}_linux_amd64.tar.gz" -C dist esp-server esp-client
          rm -f dist/esp-server dist/esp-client

          # Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-server ./cmd/esp-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-client ./cmd/esp-client
          tar -czvf "dist/esp-wrap_${TAG_NAME}_linux_arm64.tar.gz" -C dist esp-server esp-client
          rm -f dist/esp-server dist/esp-client

          # Windows amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-server.exe ./cmd/esp-server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/esp-client.exe ./cmd/esp-client
          (cd dist && zip "esp-wrap_${TAG_NAME}_windows_amd64.zip" esp-server.exe esp-client.exe)
          rm -f dist/esp-server.exe dist/esp-client.exe

          # Generate SHA-256 Checksums
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
          cat dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
